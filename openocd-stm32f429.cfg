# EdgeTX TX16S / STM32F429, ST-Link over SWD.
# Full image (includes bootloader):
#   openocd -f openocd-stm32f429.cfg -c flash_edgetx
# Bootloader only:
#   openocd -f openocd-stm32f429.cfg -c flash_bootloader
# Without a flash command, this config starts a debug server.

source [find interface/stlink.cfg]
# Support both older HLA and newer ST-Link OpenOCD drivers.
if {[adapter name] eq "hla"} {
    transport select hla_swd
} else {
    transport select dapdirect_swd
}
source [find target/stm32f4x.cfg]
adapter speed 1000

# Software reset; NRST wiring is optional.
reset_config none
# stm32f4x.cfg selects SYSRESETREQ when SRST is unavailable.

# Resolve images relative to this config, independent of the working directory.
set EDGETX_BUILD_DIR [file join [file dirname [file normalize [info script]]] build tx16s]

proc flash_edgetx {} {
    global EDGETX_BUILD_DIR
    # firmware.bin includes the 128 KiB bootloader region.
    program [file join $EDGETX_BUILD_DIR firmware.bin] verify reset exit 0x08000000
}

proc flash_bootloader {} {
    global EDGETX_BUILD_DIR
    program [file join $EDGETX_BUILD_DIR bootloader.bin] verify reset exit 0x08000000
}
